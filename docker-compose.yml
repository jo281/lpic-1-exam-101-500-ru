version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lpic1-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lpic1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lpic1pass}
      POSTGRES_DB: ${POSTGRES_DB:-lpic1}
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lpic1} -d ${POSTGRES_DB:-lpic1}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lpic1-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lpic1-frontend
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
